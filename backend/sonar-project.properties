# ============================================================================
#  Al Día — análisis del BACKEND en SonarQube Cloud (https://sonarcloud.io)
#  Lo ejecuta el job «Backend» de .github/workflows/sonar.yml con projectBaseDir=backend,
#  así que las rutas son relativas a esta carpeta. El frontend tiene su propio proyecto
#  (frontend/sonar-project.properties) y su propio Quality Gate.
# ============================================================================

sonar.organization=2510251000
# Se conserva la clave del proyecto de siempre: mantiene el historial del backend.
sonar.projectKey=2510251000_Proyecto-Software
sonar.projectName=Al Día - Backend

sonar.sourceEncoding=UTF-8

# --- Código y pruebas (Java 17) ---------------------------------------------------
sonar.sources=src/main/java
sonar.tests=src/test/java
sonar.java.source=17
sonar.java.binaries=target/classes
sonar.java.test.binaries=target/test-classes
sonar.java.libraries=target/dependency/*.jar
sonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml

# --- Fuera de la cobertura: arranque, configuración y objetos sin lógica ------
sonar.coverage.exclusions=\
  src/main/java/com/aldia/AlDiaApplication.java,\
  src/main/java/com/aldia/infraestructura/configuracion/**,\
  src/main/java/com/aldia/infraestructura/web/dto/**,\
  src/main/java/com/aldia/infraestructura/persistencia/entidad/**
