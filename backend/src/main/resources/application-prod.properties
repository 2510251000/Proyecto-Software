# Sin valores predeterminados: si falta una variable, la aplicacion no arranca.
spring.datasource.url=${DB_URL}

spring.jpa.show-sql=false

jwt.expiracion-ms=${JWT_EXPIRACION_MS}
cors.origenes-permitidos=${CORS_ORIGENES}

# Swagger apagado en produccion
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
