spring.application.name=backend

# Perfil activo: dev (local), test o prod. Se cambia con la variable PERFIL_ACTIVO.
spring.profiles.active=${PERFIL_ACTIVO:dev}

# ---- Comun a todos los perfiles ----
server.port=${PUERTO:8080}

spring.datasource.username=${DB_USUARIO}
spring.datasource.password=${DB_CONTRASENA}

# El esquema lo crean los scripts de database/. Hibernate solo verifica que coincida.
spring.jpa.hibernate.ddl-auto=validate
# Las consultas se hacen dentro de los adaptadores; no hace falta mantener la sesion abierta en la vista.
spring.jpa.open-in-view=false

jwt.clave-secreta=${JWT_CLAVE_SECRETA}

# Zona horaria que define que es "hoy" para el limite diario de publicaciones.
aldia.zona-horaria=${ZONA_HORARIA:America/Bogota}
