# ============================================================================
#  Al Día — análisis de calidad en SonarQube Cloud (https://sonarcloud.io)
#  Lo ejecuta .github/workflows/sonar.yml en cada push a dev/main y en cada PR.
#  Backend y frontend se analizan juntos como un solo proyecto.
# ============================================================================

# Si al importar el repo en SonarQube Cloud salen otros valores, cámbialos aquí.
sonar.organization=2510251000
sonar.projectKey=2510251000_Proyecto-Software
sonar.projectName=Al Día - Portal de Noticias

sonar.sourceEncoding=UTF-8

# --- Código y pruebas ---------------------------------------------------------
sonar.sources=backend/src/main/java,frontend/src
sonar.tests=backend/src/test/java,frontend/src
sonar.test.inclusions=frontend/src/**/*.spec.ts
sonar.exclusions=frontend/src/**/*.spec.ts,frontend/src/testing/**

# --- Backend (Java 17) ----------------------------------------------------------
sonar.java.source=17
sonar.java.binaries=backend/target/classes
sonar.java.test.binaries=backend/target/test-classes
sonar.java.libraries=backend/target/dependency/*.jar
sonar.coverage.jacoco.xmlReportPaths=backend/target/site/jacoco/jacoco.xml

# --- Frontend (Angular + Vitest) ------------------------------------------------
sonar.javascript.lcov.reportPaths=frontend/coverage/aldia-app/lcov.info

# --- Fuera de la cobertura: arranque, configuración y objetos sin lógica ------
sonar.coverage.exclusions=\
  backend/src/main/java/com/aldia/AlDiaApplication.java,\
  backend/src/main/java/com/aldia/infraestructura/configuracion/**,\
  backend/src/main/java/com/aldia/infraestructura/web/dto/**,\
  backend/src/main/java/com/aldia/infraestructura/persistencia/entidad/**,\
  frontend/src/main.ts,\
  frontend/src/environments/**,\
  frontend/src/app/app.config.ts,\
  frontend/src/app/app.routes.ts
