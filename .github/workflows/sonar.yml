# ============================================================================
#  Al Día — pruebas y análisis de calidad en SonarQube Cloud
#  1. Corre las pruebas del backend (Maven + JaCoCo) y del frontend (Vitest).
#  2. Envía el código y la cobertura a SonarQube Cloud con sonar-project.properties.
#  Necesita el secreto SONAR_TOKEN en Settings → Secrets and variables → Actions.
# ============================================================================
name: Calidad (SonarQube Cloud)

on:
  push:
    branches: [dev, main]
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  sonar:
    name: Pruebas y análisis
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4
        with:
          # Historial completo: Sonar lo usa para saber qué código es nuevo.
          fetch-depth: 0

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Backend — pruebas y cobertura
        working-directory: backend
        # copy-dependencies deja los .jar en target/dependency para sonar.java.libraries.
        run: bash mvnw -B verify dependency:copy-dependencies -DincludeScope=compile

      - name: Frontend — dependencias
        working-directory: frontend
        run: npm ci

      - name: Frontend — pruebas y cobertura
        working-directory: frontend
        run: npm run test:cobertura

      - name: Análisis en SonarQube Cloud
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
