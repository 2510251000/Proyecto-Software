<aside class="indice">
  <p class="antetitulo">{{ textos.hoyEnTuMunicipio }}</p>
  <p class="municipio">{{ municipio() }}</p>
  <p class="fecha">{{ fecha() }}</p>
  <ol class="lista-titulares" [attr.aria-label]="textos.titulares">
    @for (historia of historias(); track historia.id; let i = $index) {
      <li>
        <button
          type="button"
          class="titular-lista"
          [class.actual]="i === indice()"
          [attr.aria-current]="i === indice() ? 'true' : null"
          (click)="elegir.emit(i)"
        >
          <span class="numero">{{ i + 1 }}</span>
          <span>{{ historia.titulo }}</span>
        </button>
      </li>
    }
  </ol>
</aside>
