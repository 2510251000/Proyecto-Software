<div class="bloque" [class.sin-movimiento]="sinMovimiento()">
  <span class="etiqueta" [class.oficial]="noticia().oficial">
    {{ noticia().oficial ? textos.oficial : textos.comunidad }}
  </span>
  <h2 class="titulo" id="historia-titulo">
    <span class="solo-lectores-pantalla">{{ noticia().titulo }}</span>
    <span aria-hidden="true">
      @for (palabra of palabras(); track $index; let i = $index) {
        <span class="mascara"><span class="palabra" [style.animation-delay.ms]="retrasoPalabra(i)">{{ palabra }}</span></span>
      }
    </span>
  </h2>
  @if (noticia().resumen) {
    <p class="resumen">{{ noticia().resumen }}</p>
  }
  <a class="leer" [routerLink]="['/', rutas.noticias, noticia().id]">{{ textos.leerCompleta }}</a>
</div>
