<main class="pagina-auth">
  <app-panel-marca [titular]="titular" />

  <div class="panel-formulario">
    <h1>Iniciar sesión</h1>

    @if (aviso) {
      <p class="aviso" role="status">{{ aviso }}</p>
    }

    <form class="formulario" [formGroup]="formulario" (ngSubmit)="enviar()" novalidate>
      @if (error(); as mensaje) {
        <p class="error-general" role="alert">{{ mensaje }}</p>
      }

      <app-campo
        idCampo="login-correo"
        etiqueta="Correo electrónico"
        tipo="email"
        autocompletar="email"
        [control]="formulario.controls.correo"
        [errores]="erroresCorreo"
      />
      <app-campo
        idCampo="login-contrasena"
        etiqueta="Contraseña"
        tipo="password"
        autocompletar="current-password"
        [control]="formulario.controls.contrasena"
        [errores]="erroresContrasena"
      />

      <app-boton tipo="submit" [cargando]="cargando()" [bloque]="true">Entrar</app-boton>
    </form>

    <p class="enlace-alterno">
      ¿No tienes cuenta? <a [routerLink]="['/', rutas.registro]">Crea una</a>
    </p>
  </div>
</main>
