<main class="pagina-auth">
  <app-panel-marca [titular]="titular" />

  <div class="panel-formulario">
    <div class="tarjeta-formulario">
      <h1>{{ textos.tituloRegistro }}</h1>

      <form class="formulario" [formGroup]="formulario" (ngSubmit)="enviar()" novalidate>
        @if (error(); as mensaje) {
          <p class="error-general" role="alert">{{ mensaje }}</p>
        }

        <app-campo
          idCampo="registro-nombre"
          [etiqueta]="textos.nombre"
          autocompletar="name"
          [maximo]="longitudNombre"
          [control]="formulario.controls.nombre"
          [errores]="erroresNombre"
        />
        <app-campo
          idCampo="registro-correo"
          [etiqueta]="textos.correo"
          tipo="email"
          autocompletar="email"
          [control]="formulario.controls.correo"
          [errores]="erroresCorreo"
        />
        <app-campo
          idCampo="registro-contrasena"
          [etiqueta]="textos.contrasena"
          tipo="password"
          autocompletar="new-password"
          [control]="formulario.controls.contrasena"
          [errores]="erroresContrasena"
        />
        <app-campo
          idCampo="registro-confirmacion"
          [etiqueta]="textos.confirmacion"
          tipo="password"
          autocompletar="new-password"
          [control]="formulario.controls.confirmacion"
          [errores]="erroresConfirmacion"
          [errorExtra]="errorContrasenasDistintas()"
        />

        <app-selector-ciudad
          idPrefijo="registro-ciudad"
          [mostrarError]="formulario.controls.ciudadId.touched"
          (elegida)="elegirCiudad($event)"
        />

        <app-boton tipo="submit" [cargando]="cargando()" [bloque]="true">{{ textos.crearCuenta }}</app-boton>
      </form>

      <p class="enlace-alterno">
        {{ textos.conCuenta }} <a [routerLink]="['/', rutas.login]">{{ textos.iniciarSesion }}</a>
      </p>
    </div>
  </div>
</main>
