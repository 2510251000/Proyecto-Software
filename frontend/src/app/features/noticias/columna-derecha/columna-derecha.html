<aside class="columna" [attr.aria-label]="textos.etiqueta">
  @if (perfil(); as perfil) {
    <app-tu-nivel [perfil]="perfil" />
  }

  <app-avisos-cerca />

  <section class="tarjeta-lateral" aria-labelledby="columna-alcaldia">
    <h2 id="columna-alcaldia">
      <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false">
        <path d="M3 21h18M5 21V10l7-5 7 5v11M9 21v-6h6v6" />
      </svg>
      {{ textos.alcaldia }}
    </h2>
    @for (noticia of oficiales(); track noticia.id) {
      <a class="renglon-lateral" [appEnlaceNoticia]="noticia" (abrirNoticia)="abrir.emit($event)">
        <span>
          <span class="renglon-titulo">{{ noticia.titulo }}</span>
          <span class="renglon-dato">{{ datos(noticia) }}</span>
        </span>
      </a>
    } @empty {
      <p class="vacio">{{ textos.sinAlcaldia }}</p>
    }
  </section>

  @if (ciudades().length > 0) {
    <section class="municipios" aria-labelledby="columna-municipios">
      <h2 id="columna-municipios" class="etiqueta">{{ textos.municipios }}</h2>
      <div class="chips">
        @for (opcion of ciudades(); track opcion.ciudad) {
          <button
            type="button"
            class="chip"
            [attr.aria-pressed]="opcion.ciudad === ciudadActiva()"
            (click)="elegir(opcion.ciudad)"
          >
            {{ opcion.ciudad }}
            <span class="cantidad">{{ opcion.cantidad }}<span class="solo-lectores-pantalla"> {{ textos.noticias }}</span></span>
          </button>
        }
      </div>
    </section>
  }
</aside>
