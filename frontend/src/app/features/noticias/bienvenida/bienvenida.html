<section class="bienvenida" aria-labelledby="titular-portada">
  <svg class="sol" viewBox="0 0 150 96" aria-hidden="true" focusable="false">
    <path d="M35 58a40 40 0 0 1 80 0Z" fill="var(--color-sol)" />
    <rect x="15" y="64" width="120" height="8" rx="4" fill="var(--color-sobre-marca)" />
    <rect x="33" y="78" width="84" height="6" rx="3" fill="var(--color-sobre-marca)" opacity="0.6" />
  </svg>

  <p class="antetitulo">{{ antetitulo() }}</p>
  <h1 id="titular-portada" class="titular">{{ titular() }}</h1>

  <div class="fila">
    @if (iniciales()) {
      <span class="iniciales" aria-hidden="true">{{ iniciales() }}</span>
    }
    <a class="campo" [routerLink]="rutaPublicar">{{ pregunta() }}</a>
    <a class="publicar" [routerLink]="rutaPublicar">{{ textos.publicar }}</a>
  </div>

  @if (cupo()) {
    <p class="cupo">{{ cupo() }}</p>
  }
</section>
