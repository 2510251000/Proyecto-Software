<fieldset class="calificacion" [disabled]="esPropia() || guardando()">
  <legend class="titulo">{{ textos.titulo }}</legend>
  <div class="estrellas">
    @for (valor of estrellas; track valor) {
      <label class="estrella" [class.llena]="(mia() ?? 0) >= valor">
        <input
          type="radio"
          class="solo-lectores-pantalla"
          [name]="'calificacion-' + noticia().id"
          [value]="valor"
          [checked]="mia() === valor"
          (change)="calificar(valor)"
        />
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <path d="M12 2.8l2.8 5.9 6.4.8-4.7 4.4 1.2 6.4L12 17.2l-5.7 3.1 1.2-6.4-4.7-4.4 6.4-.8z" />
        </svg>
        <span class="solo-lectores-pantalla">{{ nombreEstrella(valor) }}</span>
      </label>
    }
  </div>
  <p class="resumen">{{ resumen() }}</p>
  @if (esPropia()) {
    <p class="nota">{{ textos.propia }}</p>
  }
  @if (mensaje(); as texto) {
    <p class="nota" role="status">{{ texto }}</p>
  }
  @if (error(); as texto) {
    <p class="error" role="alert">{{ texto }}</p>
  }
</fieldset>
