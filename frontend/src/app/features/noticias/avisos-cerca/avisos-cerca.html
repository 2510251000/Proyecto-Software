<section class="tarjeta-lateral" aria-labelledby="columna-avisos">
  <h2 id="columna-avisos" class="titulo">
    {{ textos.avisos }}
    @if (cantidad() > 0) {
      <span class="contador">{{ cantidad() }}<span class="solo-lectores-pantalla"> {{ textos.sinLeer }}</span></span>
    }
  </h2>

  @for (aviso of visibles(); track aviso.id) {
    <a class="renglon-lateral" [routerLink]="enlace(aviso)">
      <span class="punto" aria-hidden="true"></span>
      <span>
        <span class="renglon-titulo">{{ aviso.mensaje }}</span>
        @if (cuando(aviso)) {
          <span class="renglon-dato"><time [attr.datetime]="aviso.fecha">{{ cuando(aviso) }}</time></span>
        }
      </span>
    </a>
  } @empty {
    <p class="vacio">{{ textos.sinAvisos }}</p>
  }
</section>
