<div class="esqueleto" role="status">
  <span class="solo-lectores-pantalla">{{ textos.cargando }}</span>

  <div class="portada" aria-hidden="true">
    <div class="bloque linea chip"></div>
    <div class="bloque linea titular"></div>
    <div class="bloque linea titular corta"></div>
  </div>

  <div class="fila" aria-hidden="true">
    @for (ficha of fila1; track ficha) {
      <div class="ficha alta" [class]="ficha"></div>
    }
  </div>

  <div class="fila" aria-hidden="true">
    @for (n of fila2; track n) {
      <div class="ficha baja"></div>
    }
  </div>
</div>
