<aside class="reloj" [attr.aria-label]="textos.etiqueta">
  <p class="etiqueta">
    <svg viewBox="0 0 10 10" width="10" height="10" aria-hidden="true" focusable="false">
      <circle cx="5" cy="5" r="5" />
    </svg>
    {{ enVivo() ? textos.ahora : textos.viendo }}
  </p>

  <p class="hora" [class.larga]="partes().reloj.length > 4">{{ partes().reloj }}<span class="sufijo">{{ partes().sufijo }}</span></p>

  <div class="dia">
    <button
      type="button"
      class="cambiar-dia"
      [attr.aria-label]="textos.diaAnterior"
      [disabled]="!hayAnterior()"
      (click)="anterior.emit()"
    >
      <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false">
        <path d="M15 6l-6 6 6 6" />
      </svg>
    </button>
    <p class="fecha">{{ fecha() }}</p>
    <button
      type="button"
      class="cambiar-dia"
      [attr.aria-label]="textos.diaSiguiente"
      [disabled]="!haySiguiente()"
      (click)="siguiente.emit()"
    >
      <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false">
        <path d="M9 6l6 6-6 6" />
      </svg>
    </button>
  </div>

  @if (sinNoticias()) {
    <p class="ayuda">{{ aviso() }}</p>
  } @else {
    <p class="ayuda">{{ textos.ayuda }}</p>
  }

  @if (deViaje()) {
    <button type="button" class="volver" (click)="volver.emit()">
      <svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true" focusable="false">
        <path d="M3 12a9 9 0 1 0 3-6.7" />
        <path d="M3 4v5h5" />
      </svg>
      {{ textos.volver }}
    </button>
  }
</aside>
