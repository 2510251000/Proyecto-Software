<aside class="reloj" [attr.aria-label]="textos.etiqueta">
  <p class="etiqueta">
    <svg viewBox="0 0 10 10" width="10" height="10" aria-hidden="true" focusable="false">
      <circle cx="5" cy="5" r="5" />
    </svg>
    {{ enVivo() ? textos.ahora : textos.viendo }}
  </p>

  <p class="hora">{{ partes().reloj }}<span class="sufijo">{{ partes().sufijo }}</span></p>

  <p class="fecha">{{ fecha() }}</p>

  @if (sinNoticias()) {
    <p class="ayuda">{{ aviso() }}</p>
  } @else {
    <p class="ayuda">{{ textos.ayuda }}</p>
  }

  @if (deViaje()) {
    <button type="button" class="volver" (click)="volver.emit()">
      <svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true" focusable="false">
        <path d="M3 12a9 9 0 1 0 3-6.7" />
        <path d="M3 4v5h5" />
      </svg>
      {{ textos.volver }}
    </button>
  }
</aside>
