<div class="barra">
  <div class="pestanas" role="group" [attr.aria-label]="textos.pestanas">
    @for (opcion of pestanas; track opcion) {
      <button
        type="button"
        class="pestana"
        [class.activa]="opcion === pestanaActiva()"
        [attr.aria-current]="opcion === pestanaActiva() ? 'true' : null"
        (click)="pestana.emit(opcion)"
      >
        {{ etiquetas[opcion] }}
      </button>
    }
  </div>
</div>

@if (textoActivo() !== '') {
  <p class="activa-busqueda" role="status">
    {{ textos.resultadosPara }} «{{ textoActivo() }}»
    <button type="button" class="quitar" (click)="buscar.emit('')">{{ textos.limpiar }}</button>
  </p>
}
