@let mensaje = mensajeError();

<div class="campo">
  <label class="etiqueta" [for]="id()">{{ etiqueta() }}</label>
  <input
    class="entrada"
    [class.entrada-invalida]="mensaje !== null"
    [id]="id()"
    [type]="tipo()"
    [attr.autocomplete]="autocompletar()"
    [formControl]="control()"
    [attr.aria-invalid]="mensaje !== null"
    [attr.aria-describedby]="mensaje !== null ? idError() : null"
  />
  @if (mensaje !== null) {
    <p class="mensaje-error" [id]="idError()">{{ mensaje }}</p>
  }
</div>
