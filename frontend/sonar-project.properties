# ============================================================================
#  Al Día — análisis del FRONTEND en SonarQube Cloud (https://sonarcloud.io)
#  Lo ejecuta el job «Frontend» de .github/workflows/sonar.yml con projectBaseDir=frontend,
#  así que las rutas son relativas a esta carpeta. El backend tiene su propio proyecto
#  (backend/sonar-project.properties) y su propio Quality Gate.
# ============================================================================

sonar.organization=2510251000
# Proyecto creado aparte en SonarQube Cloud con esta misma clave.
sonar.projectKey=2510251000_Proyecto-Software-frontend
sonar.projectName=Al Día - Frontend

sonar.sourceEncoding=UTF-8

# --- Código y pruebas (Angular + Vitest) -------------------------------------------
sonar.sources=src
sonar.tests=src
sonar.test.inclusions=src/**/*.spec.ts
sonar.exclusions=src/**/*.spec.ts,src/testing/**
sonar.javascript.lcov.reportPaths=coverage/aldia-app/lcov.info

# --- Fuera de la cobertura: arranque y configuración sin lógica ---------------
sonar.coverage.exclusions=\
  src/main.ts,\
  src/environments/**,\
  src/app/app.config.ts,\
  src/app/app.routes.ts
