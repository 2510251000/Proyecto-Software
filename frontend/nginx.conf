server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Comprime el texto (JavaScript, CSS, JSON, SVG) antes de enviarlo: main.js pasa de
    # unos 270 kB a unos 80 kB. Las fotos webp ya vienen comprimidas y no se tocan.
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Rutas de Angular (/login, /noticias/5…): si no es un archivo, se entrega la aplicación.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Los archivos compilados llevan un hash en el nombre: se pueden guardar en caché mucho tiempo.
    location ~* \.(?:js|css|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Las fotos y el logo no llevan hash: caché corta para que un cambio se vea pronto.
    location ~* \.(?:webp|svg|png|ico)$ {
        expires 7d;
        try_files $uri =404;
    }

    # index.html nunca se guarda en caché: así siempre apunta a la versión nueva.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
