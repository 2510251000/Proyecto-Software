# ============================================================================
#  Al Día — versión liviana: base de datos + almacén de fotos (S3) + backend
#
#  El frontend NO va aquí: se corre aparte con `ng serve` (puerto 4200) para
#  seguir editándolo con recarga automática.
#
#  Uso (desde la raíz del repositorio):
#    1. Copiar .env.example como .env y completar los valores (una sola vez).
#    2. docker compose -f docker-compose.lite.yml up --build
#    3. En otra terminal: cd frontend && npx ng serve        → http://localhost:4200
#
#  Para apagar:            docker compose -f docker-compose.lite.yml down
#  Para borrar los datos:  docker compose -f docker-compose.lite.yml down -v
# ============================================================================

name: aldia

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: aldia_db
      POSTGRES_USER: ${DB_USUARIO:?Falta DB_USUARIO en el .env}
      POSTGRES_PASSWORD: ${DB_CONTRASENA:?Falta DB_CONTRASENA en el .env}
    volumes:
      # El esquema y los datos de demostración los crea el backend con Flyway al arrancar.
      - datos-postgres:/var/lib/postgresql/data
    ports:
      # 5433 en la máquina: el 5432 ya lo usa el PostgreSQL instalado en Windows.
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d aldia_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  s3:
    # Almacenamiento de objetos compatible con S3 para las fotos de las noticias (SeaweedFS).
    # En producción se reemplaza por AWS S3 o Cloudflare R2 cambiando solo variables del backend.
    image: chrislusf/seaweedfs:4.50
    # «mini» es la versión de un solo proceso para desarrollo; crea el bucket al arrancar.
    command: mini -dir=/data -bucket=${S3_BUCKET:-aldia-imagenes}
    environment:
      # Con estas dos variables SeaweedFS exige firma: el bucket no se puede leer sin credenciales.
      AWS_ACCESS_KEY_ID: ${S3_CLAVE_ACCESO:?Falta S3_CLAVE_ACCESO en el .env}
      AWS_SECRET_ACCESS_KEY: ${S3_CLAVE_SECRETA:?Falta S3_CLAVE_SECRETA en el .env}
    volumes:
      - datos-s3:/data
    ports:
      # Solo desde esta máquina (para correr el backend sin Docker contra el mismo almacén).
      - "127.0.0.1:8333:8333"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8333/healthz"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build: ./backend
    environment:
      PERFIL_ACTIVO: dev
      # Dentro de Docker la base se llama por el nombre del servicio, no por localhost.
      DB_URL: jdbc:postgresql://db:5432/aldia_db
      DB_USUARIO: ${DB_USUARIO}
      DB_CONTRASENA: ${DB_CONTRASENA}
      JWT_CLAVE_SECRETA: ${JWT_CLAVE_SECRETA:?Falta JWT_CLAVE_SECRETA en el .env}
      # El navegador abre el frontend en el 4200; el backend solo acepta ese origen.
      CORS_ORIGENES: http://localhost:4200
      # API de mapas: sin clave de Google se usa Nominatim (OpenStreetMap).
      GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY:-}
      GEO_PROVEEDOR: ${GEO_PROVEEDOR:-auto}
      NOMINATIM_CORREO_CONTACTO: ${NOMINATIM_CORREO_CONTACTO:-}
      NIVEL_LOGS: ${NIVEL_LOGS:-INFO}
      COMENTARIO_LARGO_MAXIMO: ${COMENTARIO_LARGO_MAXIMO:-1000}
      REPORTE_LARGO_DESCRIPCION: ${REPORTE_LARGO_DESCRIPCION:-1000}
      # Fotos de las noticias: en el bucket privado del servicio «s3».
      IMAGENES_ALMACEN: s3
      S3_ENDPOINT: http://s3:8333
      S3_REGION: us-east-1
      S3_BUCKET: ${S3_BUCKET:-aldia-imagenes}
      S3_CLAVE_ACCESO: ${S3_CLAVE_ACCESO}
      S3_CLAVE_SECRETA: ${S3_CLAVE_SECRETA}
      S3_ESTILO_RUTA: "true"
      IMAGENES_MAXIMO_POR_NOTICIA: ${IMAGENES_MAXIMO_POR_NOTICIA:-4}
      IMAGENES_TAMANO_MAXIMO_MB: ${IMAGENES_TAMANO_MAXIMO_MB:-5}
      IMAGENES_TAMANO_MAXIMO_PETICION_MB: ${IMAGENES_TAMANO_MAXIMO_PETICION_MB:-25}
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
      s3:
        condition: service_healthy

volumes:
  datos-postgres:
  datos-s3:
